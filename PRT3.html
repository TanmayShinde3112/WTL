<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FETCH API USING TODOS</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      border-radius: 5px;
      max-width: 800px;
      margin: auto;
    }
    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 10px;
      text-align: left;
      background-color: #fff;
      margin-top: 20px;
      width: 100%;
    }
    th.id,
    td.id {
      width: 5%;
      max-width: 5%;
    }
    th.title,
    td.title {
      width: 70%;
      max-width: 70%;
    }
    th.task,
    td.task {
      width: 25%;
      max-width: 25%;
    }
    button {
      background-color: tomato;
      margin-top: 20px;
      padding: 8px 16px;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 3px;
    }
    button:hover {
      background-color: #ff6347cc;
    }
  </style>
</head>
<body>
  <h1>FETCH API USING TODOS</h1>
  <button onclick="loadTodos()">FETCH DATA</button>
  <div id="todos"></div>

  <script>
   async function loadTodos() {
  try {
    const res = await fetch("movies.json");
    const todos = await res.json();

    console.log(todos);  // Add this to debug

    let html = '<table><tr><th class="id">ID</th><th class="title">Title</th><th class="task">Task</th></tr>';

    for (let i = 0; i < todos.length; i++) {
      const todo = todos[i];
      // Check todo object properties here if needed:
      console.log(todo);

      html += `<tr>
        <td class="id">${todo.id}</td>
        <td class="title">${todo.title}</td>
        <td class="task">${todo.completed ? "Yes" : "No"}</td>
      </tr>`;
    }
    html += "</table>";
    document.getElementById("todos").innerHTML = html;
  } catch (err) {
    console.error("Error in Fetching Data: ", err);
    document.getElementById("todos").innerHTML = "<p style='color:red;'>Failed to load data.</p>";
  }
}

  </script>
</body>
</html>
