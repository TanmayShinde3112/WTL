<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 100px;
      border-radius: 5px;
      max-width: 700px;
      margin: auto;
      align-items: center;
      text-align: center;
    }

    h2 {
      color: #333;
    }

    input {
      padding: 10px;
      width: 70%;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    input:focus {
      border-color: #777;
      outline: none;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      background-color: tomato;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
      font-size: 16px;
    }

    ul {
      list-style-type: none;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
      font-size: 18px;
     
      background-color: #fff;
      border-radius: 4px;
      margin-top: 20px;
    }

    li {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    li:hover {
      background-color: #e9e9e9;
    }

    li span {
      flex-grow: 1;
      text-align: left;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>My Personalized Todo List</h2>

  <input id="taskInput" placeholder="Add a task" />
  <button onclick="AddTask()">ADD TASK</button>

  <ul id="tasklist"></ul>

  <script>
    function AddTask() {
      let input = document.getElementById('taskInput');
      let text = input.value.trim();

      if (!text) {
        return alert('Enter the task');
      }

      let li = document.createElement('li');

      // Task text span
      let span = document.createElement('span');
      span.textContent = text;

      // Toggle strike-through on task text click
      span.onclick = () => {
        span.style.textDecoration =
          span.style.textDecoration === 'line-through' ? '' : 'line-through';
      };

      // Edit button
      let editBtn = document.createElement('button');
      editBtn.textContent = 'Edit';
      editBtn.onclick = () => {
        let newText = prompt('Edit Text:', span.textContent);
        if (newText) {
          span.textContent = newText.trim();
         // span.style.textDecoration = ''; // reset strike-through after edit
        }
      };

      // Delete button
      let deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = () => {
        if (confirm('Delete Task?')) li.remove();
      };

      li.appendChild(span);
      li.appendChild(editBtn);
      li.appendChild(deleteBtn);

      document.getElementById('tasklist').appendChild(li);

      input.value = '';
    }
  </script>
</body>
</html>
