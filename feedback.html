<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyCart - Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f8f9fa, #e9ecef);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      background-color: #343a40;
      padding: 20px;
      color: white;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .feedback-container {
      background-color: white;
      margin-top: 30px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .feedback-container h2 {
      margin-bottom: 20px;
      color: #343a40;
      font-size: 24px;
    }

    .stars {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      margin-bottom: 20px;
    }

    .stars input {
      display: none;
    }

    .stars label {
      font-size: 40px;
      color: lightgray;
      cursor: pointer;
      transition: color 0.3s;
    }

    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label {
      color: #ffc107;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
      height: 100px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #218838;
    }

    
    @media (max-width: 768px) {
      header {
        font-size: 24px;
        padding: 15px;
      }

      .feedback-container {
        padding: 25px;
      }

      .stars label {
        font-size: 36px;
      }

      textarea {
        font-size: 15px;
      }

      button {
        font-size: 15px;
      }
    }

   
    @media (max-width: 480px) {
      header {
        font-size: 20px;
        padding: 12px;
      }

      .feedback-container {
        margin-top: 20px;
        padding: 20px;
      }

      .feedback-container h2 {
        font-size: 20px;
      }

      .stars label {
        font-size: 30px;
      }

      textarea {
        font-size: 14px;
        height: 80px;
      }

      button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  
  <header>
    MyCart - Feedback
  </header>

  
  <div class="feedback-container">
    <h2>Rate Your Experience</h2>
    <form action="#">
      <div class="stars">
        <input type="radio" id="star5" name="rating" value="5">
        <label for="star5">&#9733;</label>

        <input type="radio" id="star4" name="rating" value="4">
        <label for="star4">&#9733;</label>

        <input type="radio" id="star3" name="rating" value="3">
        <label for="star3">&#9733;</label>

        <input type="radio" id="star2" name="rating" value="2">
        <label for="star2">&#9733;</label>

        <input type="radio" id="star1" name="rating" value="1">
        <label for="star1">&#9733;</label>
      </div>

      <textarea name="comment" placeholder="Write your feedback here..."></textarea>

      <button type="submit">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
