<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyCart - Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Universal box-sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body styling for font and background */
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* Header styling */
    header {
      background-color: #007bff;
      padding: 15px 20px;
      text-align: center;
    }

    /* Header title styling */
    header h2 {
      color: white;
      margin-bottom: 10px;
    }

    /* Navigation link styling */
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    /* Navigation link hover effect */
    nav a:hover {
      text-decoration: underline;
    }

    /* Main heading styling */
    h1 {
      text-align: center;
      margin: 30px 0 20px;
      color: #333;
    }

    /* Cart container styling */
    .cart-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 0 20px 40px;
    }

    /* Cart item card styling */
    .cart-item {
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
      text-align: center;
      display: flex; /* Use flexbox for internal layout */
      flex-direction: column; /* Stack children vertically */
      justify-content: space-between; /* Distribute space */
    }

    /* Cart item hover effect */
    .cart-item:hover {
      transform: translateY(-5px);
    }

    /* Cart item image styling */
    .cart-item img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px; /* Add some space below the image */
    }

    /* Cart item title styling */
    .cart-item h3 {
      margin: 0 0 10px; /* Adjust margin */
      font-size: 18px;
      color: #333;
    }

    /* Cart item price styling */
    .cart-item p {
      font-size: 16px;
      color: green;
      margin-bottom: 15px; /* Add some space below the price */
    }

    /* Cart item "Buy Product" link styling */
    .cart-item .buy-btn { /* Specific class for buy button */
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border-radius: 20px;
      text-decoration: none;
      transition: background-color 0.3s;
      width: 100%; /* Make button full width */
    }

    /* Cart item "Buy Product" link hover effect */
    .cart-item .buy-btn:hover {
      background-color: red;
    }

    /* Remove button styling */
    .cart-item .remove-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #dc3545; /* Red color for remove */
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
      width: 100%; /* Make button full width */
    }

    /* Remove button hover effect */
    .cart-item .remove-btn:hover {
      background-color: green;
    }

    /* Empty cart message styling */
    .empty-cart {
      text-align: center;
      font-size: 18px;
      color: #777;
      margin-top: 50px;
    }

    /* Footer styling */
    footer {
      background-color: #222;
      color: #ccc;
      text-align: center;
      padding: 20px 0;
      position: relative;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h2>MyCart</h2>
    <nav>
      <!-- Ensure product.html is the correct path to your product page -->
      <a href="PR1.html">🏠 Home</a>
      <a href="cart.html">🛒 Cart</a>
      <a href="product.html">🛍️ Products</a>
    </nav>
  </header>

  <h1>Your Cart</h1>
  <div class="cart-container" id="cartItems"></div>

  <footer>
    <p>© 2025 MyCart. All rights reserved.</p>
  </footer>

  <script>
    // Function to render cart items
    function renderCart() {
      // Retrieve cart items from local storage
      let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
      const cartContainer = document.getElementById("cartItems");

      // Clear existing items before re-rendering
      cartContainer.innerHTML = '';

      // Check if the cart is empty and display appropriate message
      if (cartItems.length === 0) {
        cartContainer.innerHTML = "<p class='empty-cart'>Your cart is empty.</p>";
      } else {
        // If cart has items, create and append product cards
        cartItems.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "cart-item";
          card.innerHTML = `
            <img src="${item.image}" alt="${item.title}">
            <h3>${item.title}</h3>
            <p>${item.price}</p>
            <a href="${item.link}" target="_blank" class="buy-btn">Buy Product</a>
            <button class="remove-btn" data-index="${index}">Remove Product</button>
          `;
          cartContainer.appendChild(card);
        });

        // Add event listeners to the new remove buttons
        document.querySelectorAll('.remove-btn').forEach(button => {
          button.addEventListener('click', (event) => {
            const indexToRemove = parseInt(event.target.dataset.index);
            removeProduct(indexToRemove);
          });
        });
      }
    }

    // Function to remove a product from the cart
    function removeProduct(index) {
      let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
      // Remove the item at the specified index
      cartItems.splice(index, 1);
      // Save the updated cart back to local storage
      localStorage.setItem('cart', JSON.stringify(cartItems));
      // Re-render the cart to reflect the removal
      renderCart();
    }

    // Initial rendering of the cart when the page loads
    renderCart();
  </script>

</body>
</html>
